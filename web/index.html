<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sfsEdgeStore - 本地监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .header {
            background: #16213e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }
        .header h1 {
            font-size: 24px;
            color: #00d9ff;
        }
        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .license-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .license-opensource {
            background: #00d9ff;
            color: #1a1a2e;
        }
        .license-enterprise {
            background: #ff6b6b;
            color: white;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 70px);
        }
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #0f3460;
        }
        .card-title {
            font-size: 16px;
            color: #00d9ff;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            background: #0f3460;
            color: #00d9ff;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .status-item {
            text-align: center;
            padding: 15px;
            background: #0f3460;
            border-radius: 8px;
        }
        .status-value {
            font-size: 28px;
            font-weight: bold;
            color: #00d9ff;
        }
        .status-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .realtime-table {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .table-container {
            flex: 1;
            overflow-y: auto;
            max-height: 300px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #0f3460;
        }
        th {
            background: #0f3460;
            color: #00d9ff;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background: #1a2a4a;
        }
        .device-name {
            color: #00d9ff;
        }
        .reading-value {
            font-weight: bold;
        }
        .chart-container {
            height: 300px;
        }
        .system-metrics {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metric-label {
            color: #888;
        }
        .metric-bar {
            width: 150px;
            height: 8px;
            background: #0f3460;
            border-radius: 4px;
            overflow: hidden;
        }
        .metric-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        .metric-fill-normal {
            background: #00d9ff;
        }
        .metric-fill-warning {
            background: #ffd93d;
        }
        .metric-fill-danger {
            background: #ff6b6b;
        }
        .metric-value {
            min-width: 60px;
            text-align: right;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #00d9ff;
            color: #1a1a2e;
        }
        .btn-primary:hover {
            background: #00b8d9;
        }
        .btn-secondary {
            background: #0f3460;
            color: #00d9ff;
        }
        .btn-secondary:hover {
            background: #1a4a7a;
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .status-dot.online {
            background: #00d9ff;
            box-shadow: 0 0 10px #00d9ff;
        }
        .status-dot.offline {
            background: #ff6b6b;
            box-shadow: 0 0 10px #ff6b6b;
        }
        .search-box {
            padding: 10px;
            background: #0f3460;
            border: none;
            border-radius: 5px;
            color: #eee;
            width: 100%;
            margin-bottom: 10px;
        }
        .search-box:focus {
            outline: 2px solid #00d9ff;
        }
        .enterprise-locked {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .enterprise-locked .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .last-update {
            font-size: 12px;
            color: #666;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .updating {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>sfsEdgeStore</h1>
        <div class="header-info">
            <div class="connection-status">
                <span class="status-dot online" id="connectionDot"></span>
                <span id="connectionStatus">连接中...</span>
            </div>
            <span class="license-badge license-opensource" id="licenseBadge">开源版</span>
        </div>
    </div>

    <div class="container">
        <div class="main-content">
            <div class="card">
                <div class="card-title">
                    <span>📊 实时数据</span>
                    <span class="badge" id="dataCount">0 条记录</span>
                </div>
                <input type="text" class="search-box" id="searchBox" placeholder="搜索设备名称..." onkeyup="filterTable()">
                <div class="table-container">
                    <table id="realtimeTable">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>设备</th>
                                <th>传感器</th>
                                <th>数值</th>
                                <th>类型</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>📈 历史趋势</span>
                    <div>
                        <select id="deviceSelect" onchange="updateChart()" style="background:#0f3460;color:#eee;padding:5px;border-radius:5px;border:none;margin-right:10px;">
                            <option value="">选择设备</option>
                        </select>
                        <select id="readingSelect" onchange="updateChart()" style="background:#0f3460;color:#eee;padding:5px;border-radius:5px;border:none;">
                            <option value="">选择传感器</option>
                        </select>
                    </div>
                </div>
                <div class="chart-container" id="trendChart"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <div class="card-title">
                    <span>🖥️ 系统状态</span>
                    <span class="last-update" id="lastUpdate">--</span>
                </div>
                <div class="system-metrics">
                    <div class="metric-row">
                        <span class="metric-label">CPU</span>
                        <div class="metric-bar">
                            <div class="metric-fill metric-fill-normal" id="cpuBar" style="width: 0%"></div>
                        </div>
                        <span class="metric-value" id="cpuValue">0%</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">内存</span>
                        <div class="metric-bar">
                            <div class="metric-fill metric-fill-normal" id="memoryBar" style="width: 0%"></div>
                        </div>
                        <span class="metric-value" id="memoryValue">0 MB</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Goroutines</span>
                        <span class="metric-value" id="goroutinesValue">0</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">运行时间</span>
                        <span class="metric-value" id="uptimeValue">0s</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>📡 MQTT 状态</span>
                </div>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-value" id="mqttReceived">0</div>
                        <div class="status-label">已接收</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="mqttProcessed">0</div>
                        <div class="status-label">已处理</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>🗄️ 数据库状态</span>
                </div>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-value" id="dbOperations">0</div>
                        <div class="status-label">操作数</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value" id="httpRequests">0</div>
                        <div class="status-label">HTTP请求</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>⚠️ 错误统计</span>
                </div>
                <div class="status-item" style="grid-column: span 2;">
                    <div class="status-value" id="errorCount">0</div>
                    <div class="status-label">错误总数</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>🔧 快速操作</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn btn-primary" onclick="refreshData()">🔄 刷新数据</button>
                    <button class="btn btn-secondary" onclick="enterFullscreen()">📺 全屏模式</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sfsEdgeStore - 本地监控</title>
    <link href="/static/bootstrap/bootstrap.min.css" rel="stylesheet">
    <script src="/static/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/static/echarts.min.js"></script>
    <style>
        :root {
            --primary-color: #00d9ff;
            --secondary-color: #16213e;
            --tertiary-color: #0f3460;
            --text-color: #eee;
            --text-muted: #888;
            --text-dark: #666;
            --danger-color: #ff6b6b;
            --warning-color: #ffd93d;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: var(--text-color);
            min-height: 100vh;
        }
        
        .bg-secondary {
            background-color: var(--secondary-color) !important;
        }
        
        .bg-tertiary {
            background-color: var(--tertiary-color) !important;
        }
        
        .text-primary {
            color: var(--primary-color) !important;
        }
        
        .border-tertiary {
            border-color: var(--tertiary-color) !important;
        }
        
        .header {
            background: var(--secondary-color);
            padding: 15px 30px;
            border-bottom: 1px solid var(--tertiary-color);
        }
        
        .header h1 {
            font-size: 24px;
            color: var(--primary-color);
        }
        
        .license-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .license-opensource {
            background: var(--primary-color);
            color: #1a1a2e;
        }
        
        .license-enterprise {
            background: var(--danger-color);
            color: white;
        }
        
        .card {
            background: var(--secondary-color);
            border-radius: 10px;
            border: 1px solid var(--tertiary-color);
        }
        
        .card-title {
            font-size: 16px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        
        .card-title .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            background: var(--tertiary-color);
            color: var(--primary-color);
        }
        
        .status-item {
            text-align: center;
            padding: 15px;
            background: var(--tertiary-color);
            border-radius: 8px;
        }
        
        .status-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .status-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }
        
        .table-container {
            overflow-y: auto;
            max-height: 300px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--tertiary-color);
        }
        
        th {
            background: var(--tertiary-color);
            color: var(--primary-color);
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background: #1a2a4a;
        }
        
        .device-name {
            color: var(--primary-color);
        }
        
        .reading-value {
            font-weight: bold;
        }
        
        .chart-container {
            height: 300px;
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .metric-label {
            color: var(--text-muted);
        }
        
        .metric-bar {
            width: 150px;
            height: 8px;
            background: var(--tertiary-color);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .metric-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        
        .metric-fill-normal {
            background: var(--primary-color);
        }
        
        .metric-fill-warning {
            background: var(--warning-color);
        }
        
        .metric-fill-danger {
            background: var(--danger-color);
        }
        
        .metric-value {
            min-width: 60px;
            text-align: right;
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: #1a1a2e;
            border: none;
        }
        
        .btn-primary:hover {
            background: #00b8d9;
        }
        
        .btn-secondary {
            background: var(--tertiary-color);
            color: var(--primary-color);
            border: none;
        }
        
        .btn-secondary:hover {
            background: #1a4a7a;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .status-dot.online {
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
        }
        
        .status-dot.offline {
            background: var(--danger-color);
            box-shadow: 0 0 10px var(--danger-color);
        }
        
        .search-box {
            padding: 10px;
            background: var(--tertiary-color);
            border: none;
            border-radius: 5px;
            color: var(--text-color);
            width: 100%;
            margin-bottom: 10px;
        }
        
        .search-box:focus {
            outline: 2px solid var(--primary-color);
        }
        
        .enterprise-locked {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        .enterprise-locked .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .last-update {
            font-size: 12px;
            color: var(--text-dark);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .updating {
            animation: pulse 1s infinite;
        }
        
        /* 响应式调整 */
        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .sidebar .card {
                flex: 1 1 45%;
                margin: 5px;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar .card {
                flex: 1 1 100%;
            }
            
            .header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            
            .header-info {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="header bg-secondary">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col">
                    <h1 class="text-primary">sfsEdgeStore</h1>
                </div>
                <div class="col-auto d-flex align-items-center gap-4">
                    <div class="connection-status">
                        <span class="status-dot online" id="connectionDot"></span>
                        <span id="connectionStatus">连接中...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid p-4">
        <div class="row gap-4">
            <div class="col-lg-9">
                <div class="row gap-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h5 class="card-title mb-0">📊 实时数据</h5>
                                    <span class="badge bg-tertiary text-primary" id="dataCount">0 条记录</span>
                                </div>
                                <input type="text" class="search-box form-control" id="searchBox" placeholder="搜索设备名称..." onkeyup="filterTable()">
                                <div class="table-container mt-3">
                                    <table id="realtimeTable" class="table table-dark table-hover">
                                        <thead>
                                            <tr>
                                                <th>时间</th>
                                                <th>设备</th>
                                                <th>传感器</th>
                                                <th>数值</th>
                                                <th>类型</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tableBody">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h5 class="card-title mb-0">📈 历史趋势</h5>
                                    <div class="d-flex gap-2">
                                        <select id="deviceSelect" onchange="updateChart()" class="form-select bg-tertiary text-light border-0">
                                            <option value="">选择设备</option>
                                        </select>
                                        <select id="readingSelect" onchange="updateChart()" class="form-select bg-tertiary text-light border-0">
                                            <option value="">选择传感器</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="chart-container" id="trendChart"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-3">
                <div class="row gap-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h5 class="card-title mb-0">🖥️ 系统状态</h5>
                                    <span class="last-update" id="lastUpdate">--</span>
                                </div>
                                <div class="system-metrics">
                                    <div class="metric-row mb-3">
                                        <span class="metric-label">CPU</span>
                                        <div class="metric-bar mx-2">
                                            <div class="metric-fill metric-fill-normal" id="cpuBar" style="width: 0%"></div>
                                        </div>
                                        <span class="metric-value" id="cpuValue">0%</span>
                                    </div>
                                    <div class="metric-row mb-3">
                                        <span class="metric-label">内存</span>
                                        <div class="metric-bar mx-2">
                                            <div class="metric-fill metric-fill-normal" id="memoryBar" style="width: 0%"></div>
                                        </div>
                                        <span class="metric-value" id="memoryValue">0 MB</span>
                                    </div>
                                    <div class="metric-row mb-3">
                                        <span class="metric-label">Goroutines</span>
                                        <span class="metric-value" id="goroutinesValue">0</span>
                                    </div>
                                    <div class="metric-row">
                                        <span class="metric-label">运行时间</span>
                                        <span class="metric-value" id="uptimeValue">0s</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title mb-4">📡 MQTT 状态</h5>
                                <div class="row gap-3">
                                    <div class="col-6">
                                        <div class="status-item">
                                            <div class="status-value" id="mqttReceived">0</div>
                                            <div class="status-label">已接收</div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="status-item">
                                            <div class="status-value" id="mqttProcessed">0</div>
                                            <div class="status-label">已处理</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title mb-4">🗄️ 数据库状态</h5>
                                <div class="row gap-3">
                                    <div class="col-6">
                                        <div class="status-item">
                                            <div class="status-value" id="dbOperations">0</div>
                                            <div class="status-label">操作数</div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="status-item">
                                            <div class="status-value" id="httpRequests">0</div>
                                            <div class="status-label">HTTP请求</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title mb-4">⚠️ 错误统计</h5>
                                <div class="status-item">
                                    <div class="status-value" id="errorCount">0</div>
                                    <div class="status-label">错误总数</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-12">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title mb-4">🔧 快速操作</h5>
                                <div class="d-flex flex-column gap-2">
                                    <button class="btn btn-primary" onclick="refreshData()">🔄 刷新数据</button>
                                    <button class="btn btn-secondary" onclick="enterFullscreen()">📺 全屏模式</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/dashboard.js"></script>
</body>
</html>

version: '3'

services:
  # MQTT Broker (Mosquitto)
  # Required for EdgeX Foundry event ingestion
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: sfsedgestore-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - sfsedgestore-net

  # sfsEdgeStore - IoT Edge Data Storage Adapter
  sfsedgestore:
    image: liaoran123/sfsedgestore:latest
    container_name: sfsedgestore
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    depends_on:
      - mqtt
    restart: unless-stopped
    networks:
      - sfsedgestore-net

  # Optional: MQTT Management UI
  # Access at http://localhost:9001
  # mqtt-ui:
  #   image: hivekeychain/mqtt-explorer:latest
  #   container_name: mqtt-explorer
  #   ports:
  #     - "9001:80"
  #   environment:
  #     - MQTT_HOST=mqtt
  #     - MQTT_PORT=1883
  #   depends_on:
  #     - mqtt
  #   networks:
  #     - sfsedgestore-net

networks:
  sfsedgestore-net:
    driver: bridge
